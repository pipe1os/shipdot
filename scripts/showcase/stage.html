<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>shipdot showcase</title>
    <!--
      The stage for the README images (rendered by scripts/screenshot.ts). Everything around
      <ship-dot> is a fake app; the widget, its hotspots and its panel are the real build.
      Query string: ?theme=light|dark&scene=hero|panel&entry=<file in entries/>

      The composition follows the logo, where p and d share one signal-red ball: the hero splits
      the frame into the app and the entry file, and the Export button's top-right corner, where
      the widget puts its hotspot, sits exactly on the seam, level with the `target` line. The
      only red in the image belongs to shipdot (hotspots, badge, accent); the app is ink and paper.
    -->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('fonts/inter.woff2') format('woff2');
        font-weight: 100 900;
        font-display: block;
      }

      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url('fonts/jetbrains-mono.woff2') format('woff2');
        font-weight: 100 800;
        font-display: block;
      }

      :root {
        --signal: #ee4423;
        --ink: #0f1724;
        --paper: #f1f3f6;

        --ground: #e6e9ee;
        --bg: #ffffff;
        --sunk: #f1f3f6;
        --sunk-strong: #e6e9ee;
        --fg: var(--ink);
        --muted: #535d6d;
        --soft: #8b93a1;
        --primary: var(--ink);
        --on-primary: #ffffff;

        --code-bg: var(--ink);
        --code-term: #19212f;
        --code-fg: #c9cfd9;
        --code-strong: #ffffff;
        --code-key: #8d97a9;
        --code-punct: #4c576b;
        --code-target: #ff7c61;
        --code-band: rgb(238 68 35 / 0.17);

        --accent: #c9381a;
        --on-accent: #ffffff;
        --float: 0 1px 2px rgb(15 23 36 / 0.08), 0 20px 44px -16px rgb(15 23 36 / 0.32);

        color-scheme: light;
      }

      :root[data-theme='dark'] {
        --ground: #0f1724;
        --bg: #161f2d;
        --sunk: #1e2838;
        --sunk-strong: #263142;
        --fg: var(--paper);
        --muted: #a3acba;
        --soft: #6f7889;
        --primary: var(--paper);
        --on-primary: var(--ink);

        --code-bg: var(--paper);
        --code-term: #e3e7ec;
        --code-fg: #2c3647;
        --code-strong: var(--ink);
        --code-key: #5b6578;
        --code-punct: #a2aab7;
        --code-target: #b8321a;
        --code-band: rgb(238 68 35 / 0.13);

        --accent: #f26446;
        --on-accent: var(--ink);
        --float: 0 1px 2px rgb(0 0 0 / 0.4), 0 24px 48px -16px rgb(0 0 0 / 0.75);

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: transparent;
      }

      body {
        color: var(--fg);
        font: 400 15px/1.45 'Inter Variable', system-ui, sans-serif;
        font-feature-settings: 'cv11', 'ss03';
        -webkit-font-smoothing: antialiased;
      }

      svg {
        flex: none;
      }

      /* Stage ------------------------------------------------------------------------------ */

      .stage {
        /* Where the app ends and the entry file begins. Export's right edge lands here. */
        --seam: 636px;
        position: relative;
        isolation: isolate;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        border-radius: 22px;
        background: var(--ground);
      }

      /* App -------------------------------------------------------------------------------- */

      .app {
        position: absolute;
        top: 36px;
        bottom: -24px;
        left: 36px;
        /* Runs 48px under the entry file so its edge never shows at the seam. */
        width: calc(var(--seam) - 36px + 48px);
        display: flex;
        flex-direction: column;
        border-radius: 14px 0 0;
        background: var(--bg);
      }

      [data-scene='panel'] .app {
        right: -24px;
        width: auto;
      }

      .top {
        display: flex;
        flex: none;
        align-items: center;
        gap: 28px;
        height: 72px;
        padding: 0 64px 0 28px;
      }

      /* The open panel lines up with the page's right edge, so nothing peeks out beside it. */
      [data-scene='panel'] .top {
        padding-right: 52px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 680;
        letter-spacing: -0.015em;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: var(--primary);
        color: var(--on-primary);
      }

      .nav {
        display: flex;
        gap: 2px;
        color: var(--muted);
        font-weight: 520;
      }

      .nav span {
        padding: 7px 12px;
        border-radius: 8px;
      }

      .nav .on {
        background: var(--sunk);
        color: var(--fg);
      }

      .end {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }

      .search {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 200px;
        height: 38px;
        margin-right: 6px;
        padding: 0 8px 0 12px;
        border-radius: 8px;
        background: var(--sunk);
        color: var(--soft);
        font-size: 14px;
      }

      kbd {
        margin-left: auto;
        padding: 3px 6px;
        border-radius: 5px;
        background: var(--bg);
        color: var(--muted);
        font: 550 11px/1 'Inter Variable', system-ui, sans-serif;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--sunk-strong);
        color: var(--fg);
        font-size: 12px;
        font-weight: 650;
      }

      ship-dot {
        --shipdot-font: 400 15px/1.5 'Inter Variable', system-ui, sans-serif;
        --shipdot-hotspot: var(--signal);
        --shipdot-accent: var(--accent);
        --shipdot-accent-contrast: var(--on-accent);
        --shipdot-bg: var(--bg);
        --shipdot-fg: var(--fg);
        --shipdot-muted: var(--muted);
        --shipdot-border: var(--sunk-strong);
        --shipdot-radius: 12px;
        --shipdot-shadow: var(--float);
        --shipdot-panel-width: 404px;
        --shipdot-trigger-size: 42px;
        color: var(--fg);
      }

      [data-theme='dark'] ship-dot {
        --shipdot-bg: var(--sunk);
      }

      /* Page ------------------------------------------------------------------------------- */

      .main {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 28px;
        min-height: 0;
        padding: 40px 48px 0 28px;
      }

      [data-scene='panel'] .main {
        padding-right: 52px;
      }

      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .crumb {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }

      .crumb span {
        padding: 0 5px;
        color: var(--soft);
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 680;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .actions button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 16px 0 13px;
        border: 0;
        border-radius: 8px;
        background: var(--sunk);
        color: var(--fg);
        font: 600 14.5px/1 'Inter Variable', system-ui, sans-serif;
        cursor: pointer;
      }

      .actions svg {
        width: 17px;
        height: 17px;
      }

      .actions .primary {
        background: var(--primary);
        color: var(--on-primary);
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      [data-scene='hero'] .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .kpi {
        padding: 16px 18px 17px;
        border-radius: 10px;
        background: var(--sunk);
      }

      .kpi p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }

      .kpi div {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 6px;
      }

      .kpi strong {
        font-size: 28px;
        font-weight: 680;
        line-height: 1.1;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }

      .delta {
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .chart {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        padding-bottom: 52px;
      }

      .chart header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .chart h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 620;
      }

      .chart h2 span {
        margin-left: 8px;
        color: var(--muted);
        font-weight: 500;
      }

      .legend {
        display: flex;
        gap: 18px;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 500;
      }

      .legend span::before {
        content: '';
        display: inline-block;
        width: 14px;
        height: 3px;
        margin: 0 8px 3px 0;
        border-radius: 2px;
        background: var(--fg);
        vertical-align: middle;
      }

      .legend span + span::before {
        background: var(--soft);
      }

      .plot {
        position: relative;
        flex: 1;
        min-height: 0;
        margin-top: 14px;
      }

      .plot-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .plot text {
        fill: var(--soft);
        font: 500 12.5px 'Inter Variable', system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }

      [data-scene='hero'] .chart header {
        display: none;
      }

      /* Entry file ------------------------------------------------------------------------- */

      .code {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: var(--seam);
        z-index: 1;
        display: flex;
        flex-direction: column;
        margin: 0;
        background: var(--code-bg);
        color: var(--code-fg);
        font: 400 14px/26px 'JetBrains Mono Variable', ui-monospace, monospace;
        font-variant-ligatures: none;
      }

      [data-scene='panel'] .code {
        display: none;
      }

      .code .file {
        display: flex;
        align-items: center;
        gap: 10px;
        /* Centred on the app's top bar. */
        height: 48px;
        margin: 48px 0 0;
        padding: 0 32px;
        color: var(--code-key);
        font: 500 14px/1 'Inter Variable', system-ui, sans-serif;
        white-space: nowrap;
      }

      .code .file b {
        color: var(--code-strong);
        font-weight: 600;
      }

      .code .file svg {
        width: 20px;
        height: 20px;
      }

      .code pre {
        margin: 0;
        font: inherit;
      }

      .code .ln {
        display: block;
        padding: 0 32px;
        white-space: pre;
      }

      .code .hl {
        background: var(--code-band);
      }

      .term {
        margin-top: auto;
        padding: 22px 32px 26px;
        background: var(--code-term);
        white-space: pre-wrap;
      }

      .t-punct {
        color: var(--code-punct);
      }

      .t-key {
        color: var(--code-key);
      }

      .t-str,
      .t-date,
      .t-type,
      .t-link {
        color: var(--code-strong);
      }

      .t-link {
        color: var(--code-fg);
      }

      .t-target {
        color: var(--code-target);
        font-weight: 650;
      }

      .t-strong {
        color: var(--code-strong);
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="app">
        <header class="top">
          <div class="brand">
            <span class="mark">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
                <rect x="1.5" y="7" width="2.6" height="5.5" rx="1" />
                <rect x="5.7" y="4" width="2.6" height="8.5" rx="1" />
                <rect x="9.9" y="1.5" width="2.6" height="11" rx="1" />
              </svg>
            </span>
            Acme
          </div>
          <nav class="nav" aria-label="Demo app">
            <span>Overview</span>
            <span class="on">Reports</span>
            <span>Customers</span>
            <span class="wide">Billing</span>
          </nav>
          <div class="end">
            <div class="search wide">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
              Search
              <kbd>⌘K</kbd>
            </div>
            <span class="avatar wide">MR</span>
            <ship-dot src="shipdot.json" storage-key="showcase" theme="light"></ship-dot>
          </div>
        </header>

        <main class="main">
          <div class="head">
            <div>
              <p class="crumb">Reports<span>/</span>Revenue</p>
              <h1>Revenue overview</h1>
            </div>
            <div class="actions">
              <button type="button" id="btn-filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                  <path d="M4 6h16M7 12h10M10 18h4" />
                </svg>
                Filter
              </button>
              <button type="button" id="btn-export" class="primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
                </svg>
                Export
              </button>
            </div>
          </div>

          <div class="kpis">
            <div class="kpi">
              <p>Revenue</p>
              <div><strong>$48.2k</strong><span class="delta">+12.4%</span></div>
            </div>
            <div class="kpi">
              <p>Orders</p>
              <div><strong>1,284</strong><span class="delta">+3.1%</span></div>
            </div>
            <div class="kpi wide">
              <p>Average order</p>
              <div><strong>$37.54</strong><span class="delta">+9.0%</span></div>
            </div>
          </div>

          <section class="chart" aria-hidden="true">
            <header>
              <h2>Daily revenue<span>Last 30 days</span></h2>
              <div class="legend"><span>This period</span><span>Previous</span></div>
            </header>
            <div class="plot"><svg class="plot-svg" data-plot aria-hidden="true"></svg></div>
          </section>
        </main>
      </div>

      <figure class="code" aria-label="Entry source">
        <div class="file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="5" width="20" height="14" rx="2.5" />
            <path d="M6 15V9l2.5 3L11 9v6M16 9v6m-2.2-2.2L16 15l2.2-2.2" stroke-linecap="round" />
          </svg>
          <span>.shipdot/entries/<b data-file></b></span>
        </div>
        <pre data-source></pre>
        <div class="term" data-term></div>
      </figure>
    </div>

    <script type="module">
      const params = new URLSearchParams(location.search)
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      const scene = params.get('scene') === 'panel' ? 'panel' : 'hero'
      const root = document.documentElement
      root.dataset.theme = theme
      root.dataset.scene = scene
      document.querySelector('ship-dot').setAttribute('theme', theme)
      if (scene === 'hero') for (const el of document.querySelectorAll('.wide')) el.remove()

      // Entry file: the entry exactly as it is compiled into shipdot.json.
      const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
      const span = (cls, text) => `<span class="t-${cls}">${esc(text)}</span>`
      const file = params.get('entry') ?? ''
      const source = await (await fetch(`entries/${encodeURIComponent(file)}`)).text()
      let fences = 0
      const lines = source.trimEnd().split('\n').map((line) => {
        if (line === '---') {
          fences++
          return { html: span('punct', line) }
        }
        if (fences === 1) {
          const [, key, value] = line.match(/^([\w-]+):\s*(.*)$/) ?? []
          if (!key) return { html: esc(line) }
          const kind = { date: 'date', type: 'type', target: 'target', link: 'link' }[key] ?? 'str'
          return {
            html: `${span('key', key)}${span('punct', ':')} ${span(kind, value)}`,
            hl: key === 'target',
          }
        }
        return {
          html: line
            .split(/\*\*(.+?)\*\*/)
            .map((part, i) =>
              i % 2 ? `${span('punct', '**')}${span('strong', part)}${span('punct', '**')}` : esc(part),
            )
            .join(''),
        }
      })
      document.querySelector('[data-file]').textContent = file
      const pre = document.querySelector('[data-source]')
      pre.innerHTML = lines
        .map((l) => `<span class="ln${l.hl ? ' hl' : ''}">${l.html}</span>`)
        .join('')

      // What `shipdot build` prints for this feed (see packages/cli/src/cli.ts).
      const feed = await (await fetch('shipdot.json')).json()
      document.querySelector('[data-term]').innerHTML =
        `${span('punct', '$')} npx shipdot build\n` +
        `✔ Built ${feed.entries.length} entries → public/shipdot.json, public/llms.txt, public/llms-full.txt`

      // Chart: this period as a line over a flat area, the previous period dashed underneath.
      const current = [
        1.12, 1.2, 1.1, 1.26, 1.34, 1.22, 1.38, 1.45, 1.33, 1.49, 1.55, 1.44, 1.6, 1.66, 1.54,
        1.5, 1.64, 1.74, 1.66, 1.76, 1.84, 1.7, 1.8, 1.9, 1.96, 1.85, 2.0, 2.1, 2.01, 2.18,
      ]
      const previous = [
        1.0, 1.04, 0.97, 1.07, 1.12, 1.05, 1.14, 1.1, 1.18, 1.13, 1.2, 1.16, 1.24, 1.19, 1.27,
        1.21, 1.29, 1.24, 1.31, 1.27, 1.34, 1.29, 1.36, 1.32, 1.38, 1.34, 1.41, 1.36, 1.43, 1.4,
      ]
      await document.fonts.ready
      const svg = document.querySelector('[data-plot]')
      const { width, height } = svg.parentElement.getBoundingClientRect()
      const left = 4
      const bottom = height - 26
      const top = 10
      const [low, high] = [0.85, 2.3]
      const x = (i) => left + (i / (current.length - 1)) * (width - left - 8)
      const y = (v) => bottom - ((v - low) / (high - low)) * (bottom - top)
      const smooth = (values) => {
        const p = values.map((v, i) => [x(i), y(v)])
        let d = `M${p[0][0]},${p[0][1]}`
        for (let i = 0; i < p.length - 1; i++) {
          const [a, b, c, e] = [p[i - 1] ?? p[i], p[i], p[i + 1], p[i + 2] ?? p[i + 1]]
          const c1 = [b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6]
          const c2 = [c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6]
          d += ` C${c1},${c2},${c}`
        }
        return d
      }
      const days = ['Sep 15', 'Sep 22', 'Sep 29', 'Oct 6', 'Oct 13']
      const labels = days
        .map((d, i) => {
          const anchor = i === 0 ? 'start' : i === days.length - 1 ? 'end' : 'middle'
          return `<text x="${x(i * 7)}" y="${height - 2}" text-anchor="${anchor}">${d}</text>`
        })
        .join('')
      const line = smooth(current)
      const end = [x(current.length - 1), y(current.at(-1))]
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`)
      svg.innerHTML = `
        ${labels}
        <path d="${line} L${end[0]},${bottom} L${left},${bottom} Z" fill="var(--fg)" fill-opacity="0.05" />
        <path d="${smooth(previous)}" fill="none" stroke="var(--soft)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" />
        <path d="${line}" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="${end[0]}" cy="${end[1]}" r="5" fill="var(--fg)" stroke="var(--bg)" stroke-width="2.5" />`

      // The seam: the target line's band is centred on Export's top edge, where the hotspot sits.
      if (scene === 'hero') {
        const band = pre.querySelector('.hl').getBoundingClientRect()
        const dot = document.querySelector('#btn-export').getBoundingClientRect().top
        const shift = dot - (band.top + band.height / 2)
        if (shift < 0) throw new Error('The target line sits below the hotspot; reorder the entry.')
        pre.style.paddingTop = `${shift}px`
      }

      // The real widget: loads shipdot.json, shows the badge and puts hotspots on the buttons.
      document.addEventListener('shipdot:ready', () => (root.dataset.ready = ''), { once: true })
      await import('./shipdot.js')
    </script>
  </body>
</html>
