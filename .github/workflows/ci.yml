name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Ubuntu job names stay `Check (Node N)`: the main branch ruleset requires them by name.
    name: Check (${{ matrix.os == 'windows-latest' && 'Windows, ' || '' }}Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 24 is the active LTS (minimum supported), 26 becomes LTS on 2026-10-28.
        node: [24, 26]
        # Windows catches builds that are not reproducible across operating systems. Node 24
        # runs the full build (Action bundle, docs, examples), which is what can drift.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Docs and examples typecheck against the built packages, so build first.
      # Node 24 also builds docs and examples to prove they build; Node 26 only needs the packages.
      - run: pnpm build
        if: matrix.node == 24
      - run: pnpm build:packages
        if: matrix.node != 24
      # The build must not change tracked files (for example a stale action/dist) or leave
      # untracked ones (generated output must be gitignored). See docs/adr/0005.
      - name: Build leaves the working tree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::pnpm build changed the working tree. Commit the regenerated files (pnpm build:action for action/dist) or gitignore generated output."
            git status --porcelain
            git --no-pager diff --text | head -n 100 || true
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - name: Widget size budget
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm size

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests run headless, so the headless shell is enough. The runner image already ships
      # Chromium's system libraries (`--with-deps` only added extra fonts, at ~15s of apt).
      - run: pnpm exec playwright install --only-shell chromium
      # `test:e2e` builds the widget first.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
