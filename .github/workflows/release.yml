name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish packages
    # Publishes with npm trusted publishing (OIDC): no NPM_TOKEN secret exists or is needed.
    # `changeset publish` runs `pnpm publish` (pnpm from `packageManager`), and pnpm >= 12
    # exchanges the GitHub OIDC token for a short-lived npm token and attaches provenance.
    # No `registry-url` on setup-node on purpose: it would write an .npmrc with a placeholder
    # NODE_AUTH_TOKEN. Requirements: trusted publishing configured on npmjs.com for shipdot,
    # @shipdot/core and @shipdot/cli (this repository, workflow "release.yml"), and the
    # repository variable SHIPDOT_RELEASE_ENABLED set to "true".
    if: ${{ vars.SHIPDOT_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the "Version packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
