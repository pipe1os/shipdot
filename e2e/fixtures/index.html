<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shipdot e2e</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #18181b; background: #fff; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid #e4e4e7; }
      main { padding: 24px 16px; }
      .spacer { height: 1600px; }
      button.app { padding: 8px 16px; font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <strong>Acme Reports</strong>
      <div id="widget-slot"></div>
    </header>
    <main>
      <h1>Dashboard</h1>
      <p><button type="button" class="app" id="btn-share">Share</button></p>
      <p id="export-row"></p>
      <div class="spacer"></div>
      <p>Bottom of the page</p>
    </main>
    <script type="module">
      // Test knobs: ?mode=&locale=&theme=&first-visit=&hotspots=&late=1&no-target=1&hidden=1&pane=1&bottom=1
      const params = new URLSearchParams(location.search)
      // pane=1: the export row lives in a scroll container. bottom=1: the bell sits in a footer.
      if (params.has('pane')) {
        const pane = document.createElement('div')
        pane.id = 'pane'
        pane.style.cssText = 'height:200px;margin-top:300px;overflow:auto;border:1px solid #e4e4e7'
        pane.innerHTML = '<div style="height:600px"></div>'
        pane.prepend(document.querySelector('#export-row'))
        document.querySelector('main').prepend(pane)
      }
      if (params.has('bottom')) {
        const slot = document.querySelector('#widget-slot')
        slot.style.cssText = 'position:fixed;right:16px;bottom:8px'
      }
      const addExport = () => {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = 'app'
        button.id = 'btn-export'
        button.textContent = 'Export'
        if (params.has('hidden')) button.style.display = 'none'
        document.querySelector('#export-row').append(button)
      }
      if (!params.has('no-target')) {
        if (params.has('late')) setTimeout(addExport, 600)
        else addExport()
      }
      const el = document.createElement('ship-dot')
      el.setAttribute('src', 'shipdot.json')
      el.setAttribute('first-visit', params.get('first-visit') ?? 'show-latest')
      for (const name of ['mode', 'locale', 'theme', 'hotspots', 'storage-key'])
        if (params.has(name)) el.setAttribute(name, params.get(name))
      document.querySelector('#widget-slot').append(el)
      await import('/dist/shipdot.js')
    </script>
  </body>
</html>
